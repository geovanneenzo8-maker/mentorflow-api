# Perfil de Produção / Container com PostgreSQL (--spring.profiles.active=postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mentorflow}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mentorflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mentorflow123}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
