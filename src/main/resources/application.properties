spring.application.name=MentorFlow API
server.port=8080

# Banco de Dados Padrão (Zero-Config para execução imediata por recrutadores)
spring.datasource.url=jdbc:h2:mem:mentorflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console visual do banco H2 (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Suporte nativo RFC 7807 (Problem Details for HTTP APIs)
spring.mvc.problemdetails.enabled=true

# OpenAPI 3 / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Spring Boot Actuator (Observabilidade & Healthcheck)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
