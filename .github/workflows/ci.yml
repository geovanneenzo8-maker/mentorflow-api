name: Java CI — Concurrency Suite (H2 & Real PostgreSQL 16)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mentorflow
          POSTGRES_USER: mentorflow
          POSTGRES_PASSWORD: mentorflow123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration & Multi-Threaded Concurrency Tests (PostgreSQL 16 Real)
        env:
          SPRING_PROFILES_ACTIVE: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mentorflow
          SPRING_DATASOURCE_USERNAME: mentorflow
          SPRING_DATASOURCE_PASSWORD: mentorflow123
        run: chmod +x mvnw && ./mvnw clean test -B

      - name: Run Integration & Multi-Threaded Concurrency Tests (Default Profile)
        run: ./mvnw test -B
